# Expert sources — weights adjustable in dashboard
# source_id must be stable (used as key in intel files)
sources:
  - id: tv2_axelgaard
    name: "Emil Axelgaard / TV2 Sport"
    url_pattern: "tv2.dk/sport/cykling"
    default_weight: 1.5
    notes: "Primary Danish source, Giro specialist"

  - id: the_inner_ring
    name: "The Inner Ring"
    url_pattern: "inrng.com"
    default_weight: 1.2
    notes: "Tactical analysis, team strategy"

  - id: velonews
    name: "VeloNews"
    url_pattern: "velonews.com"
    default_weight: 1.0

  - id: cyclingnews
    name: "CyclingNews"
    url_pattern: "cyclingnews.com"
    default_weight: 1.0

  - id: procyclingstats
    name: "ProCyclingStats"
    url_pattern: "procyclingstats.com"
    default_weight: 0.8
    notes: "Data only, no narrative — use for startlist/team confirmation"

  - id: firstcycling
    name: "FirstCycling"
    url_pattern: "firstcycling.com"
    default_weight: 0.8

# Weights are defaults. Override per-stage in dashboard.
# Add new sources here — they appear in dashboard automatically.
# Do not hardcode source weights anywhere in code — always read from this file.
